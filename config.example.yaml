# Optional. Copy to config.yaml to override defaults.
# Write decimals as strings. A bare 0.01 is a binary float and is rejected.
# Every risk limit below is at the hard cap. You may tighten them. You may not loosen them.

mode: paper
starting_cash: "1000"
symbols:
  - BTC-USD
  - ETH-USD
cost_per_side: "0.01"
max_position_pct: "0.50"
max_total_exposure_pct: "1"
max_daily_loss_pct: "0.04"
# Paper only. Mark-to-bid drawdown on trend_daily and dca_weekly. Config may
# only tighten these, and the freeze must stay below the kill. Do not carry
# them into a live phase.
freeze_drawdown_pct: "0.10"
kill_drawdown_pct: "0.40"
max_trades_per_day: 2
max_quote_age_seconds: 30
max_daily_turnover_pct: "1"
max_spread_per_side: "0.02"
min_order_notional: "10"
# Chosen before any backtest. The 7-day hold is the risk floor.
sma_window: 200
trend_band: "0.02"
min_hold_days: 7
trend_target_weight: "0.50"
dca_notional: "19.23"
loop_seconds: 60
# v1 paper source. Coinbase public bid/ask prices marks, fills, and the spread cap.
# Kraken is diagnostic only. There is no Robinhood fallback.
market_data: public
public_provider: coinbase
# Advisory AI veto on trend_daily entries (exits are never gated), in `rhbot run` only.
# It can only drop a proposed order; risk checks still run on what it approves.
# Buy-and-hold and weekly DCA are never gated. Replay and backtest never call it.
# Every verdict is an `ai_gate` event in the audit log. A timeout, missing CLI,
# quota error, unparseable answer, or the daily cap is a veto.
# Turn it off with `enabled: false` (restart), or at once by creating
# `<state_dir>/AI_GATE_OFF`. No API keys belong here; the CLIs use their own login.
ai_gate:
  enabled: true
  # Tried in order. cursor = Cursor agent CLI, codex = Codex CLI.
  backends:
    - cursor
    - codex
  # Seconds shared by every review in one cycle (5-90).
  timeout_s: 60
  # Backend invocations per UTC day, counted from the audit log (0-100).
  max_calls_per_day: 10
  # Optional. Leave unset to use each CLI's default model.
  # cursor_model: null
  # codex_model: null
