[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhbot"
version = "0.1.0"
description = "Paper-only BTC/ETH bot with pluggable quotes, a risk engine, and an operator CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rhbot = "rhbot.cli:main"

[tool.setuptools.packages.find]
include = ["rhbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
